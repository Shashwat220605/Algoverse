name: Cleanup Dijkstra Navigation
on:
  push:
    branches: [feat/dijkstra-learning-hub-nav]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean duplicate menu entry
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/pages/AlgorithmWorkspace.jsx')
          s = p.read_text()
          duplicate = '      ["dijkstra", "Dijkstra 🧭"],\n      ["dijkstra", "Dijkstra 🧭"],'
          s = s.replace(duplicate, '      ["dijkstra", "Dijkstra 🧭"],')
          p.write_text(s)
          p = Path('src/components/LearningHub.jsx')
          s = p.read_text()
          typo = '  useEffect(() => { const openDijkstra = () => { setOpen(true); setTab("dijkstra"); }; window.addEventListener("algoversse:open-dijkstra", openDijkstra); return () => window.removeEventListener("algoversse:open-dijkstra", openDijkstra); }, []);\n\n'
          s = s.replace(typo, '')
          p.write_text(s)
      - name: Commit cleanup and remove workflow
        run: |
          git rm .github/workflows/cleanup-dijkstra-nav.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/AlgorithmWorkspace.jsx src/components/LearningHub.jsx
          git commit -m "fix: clean Dijkstra navigation" || exit 0
          git push
