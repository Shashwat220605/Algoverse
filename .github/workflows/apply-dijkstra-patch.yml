name: Apply Dijkstra Navigation Patch
on:
  push:
    branches: [feat/dijkstra-learning-hub-nav]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch workspace
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/pages/AlgorithmWorkspace.jsx')
          s = p.read_text()
          s = s.replace('["bfs", "BFS"],\n      ["dfs", "DFS"],', '["bfs", "BFS"],\n      ["dfs", "DFS"],\n      ["dijkstra", "Dijkstra 🧭"],')
          s = s.replace('onChange={(event) => setAlgorithm(event.target.value)}', 'onChange={(event) => { const value = event.target.value; if (value === "dijkstra") { window.dispatchEvent(new CustomEvent("algoverso:open-dijkstra")); return; } setAlgorithm(value); }}')
          p.write_text(s)
          p = Path('src/components/LearningHub.jsx')
          s = p.read_text()
          marker = '  const refresh = () => setProgress(loadProgress());'
          insert = marker + '\n  useEffect(() => { const openDijkstra = () => { setOpen(true); setTab("dijkstra"); }; window.addEventListener("algoverso:open-dijkstra", openDijkstra); return () => window.removeEventListener("algoverso:open-dijkstra", openDijkstra); }, []);'
          if 'algoverso:open-dijkstra' not in s:
              s = s.replace(marker, insert)
          p.write_text(s)
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/AlgorithmWorkspace.jsx src/components/LearningHub.jsx
          git commit -m "feat: add Dijkstra to algorithm menu"
          git push
