name: Finish shortest path menu
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: ${{ !contains(github.event.head_commit.message, 'add shortest path algorithms to dropdown') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch dropdown integration
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/pages/AlgorithmWorkspace.jsx')
          s = p.read_text()

          s = s.replace(
              'import {\n  dfsCode,\n  createDFSTrace,\n  defaultDFSGraph,\n  defaultDFSStart,\n} from "../algorithms/graph/dfs.js";\n',
              'import {\n  dfsCode,\n  createDFSTrace,\n  defaultDFSGraph,\n  defaultDFSStart,\n} from "../algorithms/graph/dfs.js";\n'
          )

          s = s.replace(
              '["dfs", "DFS"],\n      ["dijkstra", "Dijkstra 🧭"],',
              '["dfs", "DFS"],\n      ["dijkstra", "Dijkstra 🧭"],\n      ["bellmanFord", "Bellman-Ford ⚡"],\n      ["floydWarshall", "Floyd-Warshall ▦"],'
          )

          old = 'const selectedAlgorithmName = ALGORITHM_GROUPS.flatMap((group) => group.items).find(([value]) => value === algorithm)?.[1] || "Select Algorithm";'
          new = old + '\n\n  useEffect(() => {\n    if (algorithm === "bellmanFord" || algorithm === "floydWarshall") {\n      window.dispatchEvent(new CustomEvent("algoverso:open-shortest-path", { detail: algorithm }));\n      setAlgorithm("bfs");\n    }\n  }, [algorithm]);'
          s = s.replace(old, new)

          old_select = '<select value={algorithm} onChange={(event) => { const value = event.target.value; if (value === "dijkstra") { window.dispatchEvent(new CustomEvent("algoverso:open-dijkstra")); return; } setAlgorithm(value); }}'
          new_select = '<select value={algorithm} onChange={(event) => { const value = event.target.value; if (value === "dijkstra" || value === "bellmanFord" || value === "floydWarshall") { window.dispatchEvent(new CustomEvent(value === "dijkstra" ? "algoverso:open-dijkstra" : "algoverso:open-shortest-path", { detail: value })); return; } setAlgorithm(value); }}'
          s = s.replace(old_select, new_select)

          p.write_text(s)

          p = Path('src/App.jsx')
          s = p.read_text()
          s = s.replace(
              '  const [mstOpen, setMstOpen] = useState(false);',
              '  const [mstOpen, setMstOpen] = useState(false);\n  const [shortestPathOpen, setShortestPathOpen] = useState(false);\n  const [shortestPathAlgorithm, setShortestPathAlgorithm] = useState("bellman");'
          )
          s = s.replace(
              '        setMstOpen(false);\n',
              '        setMstOpen(false);\n        setShortestPathOpen(false);\n'
          )
          s = s.replace(
              '    window.addEventListener("keydown", onKeyDown);',
              '    const onShortestPath = (event) => {\n      setShortestPathAlgorithm(event.detail === "floydWarshall" ? "floyd" : "bellman");\n      setShortestPathOpen(true);\n    };\n    window.addEventListener("algoverso:open-shortest-path", onShortestPath);\n    window.addEventListener("keydown", onKeyDown);'
          )
          s = s.replace(
              '    return () => window.removeEventListener("keydown", onKeyDown);',
              '    return () => {\n      window.removeEventListener("keydown", onKeyDown);\n      window.removeEventListener("algoverso:open-shortest-path", onShortestPath);\n    };'
          )
          s = s.replace(
              '      {mstOpen && <MSTLab onClose={() => setMstOpen(false)} />}',
              '      {mstOpen && <MSTLab onClose={() => setMstOpen(false)} />}\n      {shortestPathOpen && <ShortestPathLab onClose={() => setShortestPathOpen(false)} initialAlgorithm={shortestPathAlgorithm} />}'
          )
          s = s.replace(
              'import MSTLab from "./components/MSTLab.jsx";',
              'import MSTLab from "./components/MSTLab.jsx";\nimport ShortestPathLab from "./components/ShortestPathLab.jsx";'
          )
          p.write_text(s)
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/AlgorithmWorkspace.jsx src/App.jsx
          git diff --cached --quiet && exit 0
          git commit -m "feat: add shortest path algorithms to dropdown"
          git push
      - name: Remove one-time workflow
        run: |
          git rm .github/workflows/finish-shortest-path-menu.yml
          git commit -m "chore: remove one-time menu workflow"
          git push
